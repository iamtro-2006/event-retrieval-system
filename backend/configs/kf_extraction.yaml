project:
  name: keyframe_pipeline
  seed: 42

# Canonical methods exposed by scripts/keyframe_extraction/run.py.
method: distribution

paths:
  input_dir: ../data/videos
  output_dir: ../data

logging:
  level: INFO
  log_dir: logs
  log_to_file: true
  filename: extract_keyframes.log

omni:
  weights_path: null  # pinned official OmniShotCut v1.5 checkpoint
  cache_dir: weights/omni
  overlap: 10
  decode_batch_size: 8
  skip_existing: true

frame_loader:
  backend: nvdec  # T4/NVDEC; no silent CPU decode fallback
  image_size: 336
  num_workers: 0
  pin_memory: true
  persistent_workers: false

embedding:
  model_name: PE-Core-L14-336
  backend: perception_encoder
  pretrained: "true"
  batch_size: 16
  sample_fps: 3.0  # Only embed/sample candidates inside general shots, in source timestamps.
  device: cuda
  precision: fp16
  skip_existing: true

keyframe:
  min_scene_frames: 3
  # Keep max_scene_gap_frames as a compatibility fallback. The PE-Core path
  # now prefers the FPS-aware duration limit below.
  max_scene_gap_frames: 5000
  max_scene_seconds: 20.0
  mmr_budget_fraction: 0.50  # Final keyframes / clustered candidates; anchors can exceed budget.
  anchors_per_shot: 3
  mmr_relevance_weight: 0.40  # 0.4 representative - 0.6 similarity to selected.
  final_similarity_threshold: 0.97  # Global PE-Core cosine dedup after MMR.
  min_hist_bins: 5  # Reject only nearly uniform color; no dark-pixel gate.
  image_quality: 95
  save_images: true
  skip_existing: true

distribution:
  sample_fps: 5.0
  baseline_seconds: 8.0
  reference_test_seconds: 2.0
  current_seconds: 2.0
  window_step: 2.0
  p_value: 0.05
  consecutive_windows: 2
  local_consecutive: 3
  block_size: 2
  min_scene_seconds: 5.0
  max_scene_seconds: 30.0
  hsv_weight: 0.6
  motion_weight: 0.4
  difference_threshold: 20

kfeavi:
  analysis_width: 320
  analysis_height: 180
  grid_rows: 4
  grid_cols: 4
  sample_stride: 1
  mad_scale: 3.5
  percentile: 98.0
  min_gap_seconds: 1.0

vlm:
  enabled: false
