project:
  name: keyframe_pipeline
  seed: 42

# Canonical methods exposed by scripts/keyframe_extraction/run.py.
method: distribution

paths:
  input_dir: ../data/raw/videos
  output_dir: ../data

logging:
  level: INFO
  log_dir: logs
  log_to_file: true
  filename: extract_keyframes.log

transnet:
  repo_dir: external/TransNetV2
  weights_path: weights/transnetv2-pytorch-weights.pth
  threshold: 0.5
  batch_size: 500
  context_frames: 25
  device: auto
  skip_existing: true

frame_loader:
  backend: decord
  image_size: null
  num_workers: 0
  pin_memory: true
  persistent_workers: false

embedding:
  model_name: PE-Core-L14-336
  backend: perception_encoder
  pretrained: true
  batch_size: 8
  device: auto
  precision: fp16
  skip_existing: true

keyframe:
  min_scene_frames: 3
  # Keep max_scene_gap_frames as a compatibility fallback. The PE-Core path
  # now prefers the FPS-aware duration limit below.
  max_scene_gap_frames: 5000
  max_scene_seconds: 20.0
  hist_threshold: 0.95
  min_hist_bins: 10
  image_quality: 95
  save_images: true
  skip_existing: true

distribution:
  sample_fps: 5.0
  baseline_seconds: 8.0
  reference_test_seconds: 2.0
  current_seconds: 2.0
  window_step: 2.0
  p_value: 0.05
  consecutive_windows: 2
  local_consecutive: 3
  block_size: 2
  min_scene_seconds: 5.0
  max_scene_seconds: 30.0
  hsv_weight: 0.6
  motion_weight: 0.4
  difference_threshold: 20

kfeavi:
  analysis_width: 320
  analysis_height: 180
  grid_rows: 4
  grid_cols: 4
  sample_stride: 1
  mad_scale: 3.5
  percentile: 98.0
  min_gap_seconds: 1.0

vlm:
  enabled: false
