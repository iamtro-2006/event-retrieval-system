input_keyframes_root: ../data/keyframes
output_embeddings_root: ../data

image:
  extensions: [".jpg", ".jpeg", ".png", ".webp"]

save:
  overwrite: false
  extension: ".npy"

# Each entry is one embedding model. `enabled: false` lets you keep a model
# defined in the config without running it (handy if its deps/checkpoint
# aren't installed on this machine yet). Every model writes to its own
# subfolder: <output_embeddings_root>/<key>/<dataset>/<video>/<frame>.npy
models:

  # Meta Perception Encoder Core. All PE-Core sizes use the same backend;
  # change `name` to T16-384 / S16-384 / B16-224 / L14-336 / G14-448.
  # Disabled by default because the official perception_models package and
  # checkpoint weights are large optional dependencies.
  - key: pe_core_l14_336
    enabled: false
    backend: perception_encoder
    name: PE-Core-L14-336
    pretrained: true          # downloads the official checkpoint from HF
    device: auto
    precision: amp
    batch_size: 8
    normalize: true
    perception_encoder:
      center_crop: false      # official default: resize/squash to model size
      # repo_path: D:/path/to/perception_models  # alternative to pip install
      # checkpoint_path: D:/path/to/PE-Core-L14-336.pt

  # ViT-SO400M-16-SigLIP2-384
  - key: siglip2_so400m_384
    enabled: true
    backend: open_clip
    name: ViT-SO400M-16-SigLIP2-384
    pretrained: webli          # -> resolves to hf-hub:timm/ViT-SO400M-16-SigLIP2-384
    device: auto
    precision: fp32
    batch_size: 32
    normalize: true

  # ViT-H-14-378-quickgelu
  - key: dfn_vit_h14_378
    enabled: true
    backend: open_clip
    name: ViT-H-14-378-quickgelu
    pretrained: dfn5b          # -> resolves to hf-hub:apple/DFN5B-CLIP-ViT-H-14-378
    device: auto
    precision: fp32
    batch_size: 16
    normalize: true

  # BLIP2
  - key: blip2_itm_vitg
    enabled: true
    backend: blip2
    name: BLIP2-ViT-G
    pretrained: Salesforce/blip2-itm-vit-g
    device: auto
    precision: fp32
    batch_size: 16
    normalize: true
    pooling: first            # first (default, matches text[:,0,:] later for retrieval) | none (32x256, best recall but needs late-interaction search) | mean
