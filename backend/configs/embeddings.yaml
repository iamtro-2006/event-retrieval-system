input_keyframes_root: ../data/keyframes
output_embeddings_root: ../data/embeddings

image:
  extensions: [".jpg", ".jpeg", ".png", ".webp"]

save:
  overwrite: false
  extension: ".npy"

# Output: ../data/embeddings/embeddings_qwen3_vl_embedding_2b_vllm/V3C/<video>/<frame>.npy
models:
  - key: qwen3_vl_embedding_2b
    enabled: true
    backend: qwen3_vl_embedding
    name: Qwen/Qwen3-VL-Embedding-2B
    engine: vllm
    device: auto
    precision: fp16
    batch_size: 8
    normalize: false
