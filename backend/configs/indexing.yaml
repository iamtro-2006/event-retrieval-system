# Build exactly one physical index at a time:
# python scripts/retrieval/run.py --dataset aic|cam
# For the complete PE-Core + SigLIP2 matrix on both datasets, use
# scripts/retrieval/rebuild_pe_siglip.py --dataset aic|cam --model pe|siglip2.
# Every descendant belongs to the selected physical root; child folder names
# are intentionally not listed here.
datasets:
  default: aic
  available:
    aic:
      keyframes_root: ../data/AIC/keyframes
      embeddings_root: ../data/AIC/embeddings/embeddings_pe_core_l14_336
      map_keyframes_root: ../data/AIC/map_keyframes
      index:
        output_dir: ../data/AIC/database/faiss_hnsw_pe_core_l14_336
    cam:
      keyframes_root: ../data/CAM/keyframes
      embeddings_root: ../data/CAM/embeddings/embeddings_siglip2_so400m_384
      map_keyframes_root: ../data/CAM/map-keyframes
      index:
        output_dir: ../data/CAM/database/faiss_hnsw_siglip2_so400m_384

# Backward-compatible defaults; the selected dataset overrides these roots.
keyframes_root: ../data/AIC/keyframes
embeddings_root: ../data/AIC/embeddings/embeddings_pe_core_l14_336
map_keyframes_root: ../data/AIC/map_keyframes

index:
  output_dir: ../data/AIC/database/faiss_hnsw_pe_core_l14_336
  index_name: keyframes.faiss
  metadata_name: metadata.csv
  type: hnsw
  metric: cosine
  hnsw_m: 32
  ef_construction: 820
  ef_search: 512

# Per-model build inputs for the shared indexing config. The top-level
# PE-Core build remains the existing default for scripts/retrieval/run.py.
models:
  - model_key: wemm_embedding_2b
    embeddings_root: ../data/processed/embeddings/embeddings_wemm_embedding_2b
    keyframes_root: ../data/processed/keyframes
    map_keyframes_root: ../data/processed/map_keyframes
    index:
      output_dir: ../data/database/faiss_wemm_embedding_2b_full
      index_name: keyframes.faiss
      metadata_name: metadata.csv
      type: flat
      metric: cosine
      dimension: 2048
