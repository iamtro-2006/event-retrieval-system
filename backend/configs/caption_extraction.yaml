# Offline shot caption extraction. Output JSON mirrors the ASR segment layout.
extraction:
  shot_source: keyframes  # Reuse the final scenes from keyframe extraction; never detect again.
  shot_model: uva-cv-lab/OmniShotCut_v1.5
  shot_revision: 1bc678977ad48c65d57d600296d95f97c1be293f
  caption_model: OpenGVLab/InternVL3_5-2B
  caption_profile: 16x448  # 24x448 | 16x448 | 12x448; maximum per scene input.
  caption_min_color_bins: 5  # Drop sampled frames with <5 occupied bins in the full RGB 8x8x8 histogram.
  caption_batch_size: auto  # 6 requests on one GPU, 12 on two GPUs.
  print_captions: false  # Progress bars by default; enable to print each final caption.
  vllm:
    gpu_memory_utilization: 0.88
    max_model_len: 6144
    tensor_parallel_size: auto  # Use 1 GPU, or shard across 2 when at least 2 are visible.
    max_num_seqs: auto  # 3 concurrent shots on one GPU, 6 on two.
    max_num_batched_tokens: auto  # 4096 / 8192 for 1 / 2 GPUs.
    enable_prefix_caching: true
    enforce_eager: false
  speed_predictor:
    label_rule_version: 2
    model: james020619/VideoMAEv2-SpeedPredictor
    revision: 31e6f61
    recursion: 3
    decoder: simple
    timelapse_threshold: 1.8
    slow_motion_threshold: 0.6
  language: English
  min_caption_seconds: 1.0
  frame_sample_fps: 1.5
  max_new_tokens: 220
  duplicate_max_gap: 0.25
  duplicate_similarity: 0.90
  prompt: >-
    Describe the following video segment in English. Begin with "The video segment". In 1-4 detailed sentences, focusing main visible subjects, their distinctive details and positions, the relevant surroundings at that moment. Describe what happens from the beginning to the end in reasonable chronological order, including meaningful changes, interactions between subjects, and camera movement when visible. Be specific about observable actions, scene, interaction and subject attribute details and identity rather than giving a broad summary. Include only what can be seen; omit uncertain or absent details without mentioning their absence. DO NOT GUESS any event, action or intent.
