# Offline shot caption extraction. Output JSON mirrors the ASR segment layout.
extraction:
  shot_model: uva-cv-lab/OmniShotCut_v1.5
  shot_revision: 1bc678977ad48c65d57d600296d95f97c1be293f
  caption_model: DAMO-NLP-SG/VideoLLaMA3-2B
  speed_predictor:
    label_rule_version: 2
    model: james020619/VideoMAEv2-SpeedPredictor
    revision: 31e6f61
    recursion: 3
    timelapse_threshold: 1.8
    slow_motion_threshold: 0.6
  language: English
  max_shot_seconds: 10.0
  min_caption_seconds: 1.0
  frame_sample_fps: 1.5
  caption_profiles:
    - {max_frames: 16, short_side: 256}
    - {max_frames: 16, short_side: 224}
    - {max_frames: 12, short_side: 224}
    - {max_frames: 8, short_side: 224}
  max_new_tokens: 220
  duplicate_max_gap: 0.25
  duplicate_similarity: 0.90
  prompt: >-
    Describe the following video segment in English. Begin with "The video segment". In 2-4 detailed but concise sentences, describe the main visible subjects, their distinctive details and positions, and the relevant surroundings at that moment. Describe what happens from the beginning to the end in chronological order, including meaningful changes, interactions between subjects, and camera movement when visible. Be specific about observable actions, scene, interaction and subject attribute details and identity rather than giving a broad summary. Include only what can be seen; omit uncertain or absent details without mentioning their absence. Do not infer speech, sounds, names, or intent.
