# Runtime config for the API (`src.api.main` -> `src.retrieval.system.build_system`).
# Keep this file as the single source of truth for online search.

semantic:
  default_model_key: BEiT-3
  models:
    - model_key: siglip2-so400m
      enabled: false
      model_name: ViT-SO400M-16-SigLIP2-384
      index_path: D:/event-retrieval-system/data/database/faiss_hnsw_siglip2_so400m_384/keyframes.faiss
      metadata_path: D:/event-retrieval-system/data/database/faiss_hnsw_siglip2_so400m_384/metadata.csv
      device: auto
      precision: amp
      normalize: true
      ef_search: 399
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: D:/event-retrieval-system/data/database/faiss_hnsw_siglip2_so400m_384/vectors_fp32.npy
      allow_npy_fallback: false

    - model_key: vitH-378-quickgelu
      enabled: false
      model_name: ViT-H-14-378-quickgelu
      index_path: D:/event-retrieval-system/data/database/faiss_hnsw_dfn_vit_h14_378/keyframes.faiss
      metadata_path: D:/event-retrieval-system/data/database/faiss_hnsw_dfn_vit_h14_378/metadata.csv
      device: auto
      precision: amp
      normalize: true
      ef_search: 399
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: D:/event-retrieval-system/data/database/faiss_hnsw_dfn_vit_h14_378/vectors_fp32.npy
      allow_npy_fallback: false

    - model_key: BLIP2
      enabled: false
      model_name: BLIP2
      index_path: data/database/embedding_blip2_itm_vitg/keyframes.faiss
      metadata_path: data/database/embedding_blip2_itm_vitg/metadata.csv
      device: auto
      precision: fp32
      normalize: true
      ef_search: 399
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: data/database/embedding_blip2_itm_vitg/vectors_fp32.npy
      allow_npy_fallback: false
      model_extra:
        pooling: first

    - model_key: BEiT-3
      enabled: true
      model_name: BEiT-3
      index_path: D:/event-retrieval-system/data/database/faiss_beit3_large_itc/keyframes.faiss
      metadata_path: D:/event-retrieval-system/data/database/faiss_beit3_large_itc/metadata.csv
      device: auto
      precision: fp32
      normalize: true
      ef_search: 399
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32 
      vector_cache_path: D:/event-retrieval-system/data/database/embedding_beit3_large_itc/vectors_fp32.npy
      allow_npy_fallback: false
      model_extra:
        beit3:
          repo_path: D:/event-retrieval-system/backend/external/unilm/beit3
          model_arch: beit3_large_patch16_384_retrieval
          checkpoint_path: D:/event-retrieval-system/backend/weights/beit3_large_patch16_384_f30k_retrieval.pth
          input_size: 384
          spm_path: D:/event-retrieval-system/backend/weights/beit3.spm
          max_text_len: 64

ocr:
  config_path: configs/ocr_extraction.yaml

asr:
  config_path: configs/asr_extraction.yaml

paths:
  keyframes_root: D:/event-retrieval-system/data/keyframes
  videos_root: D:/event-retrieval-system/data/videos
  map_keyframe_path: D:/event-retrieval-system/map_keyframes

search:
  candidate_multiplier: 4
  default_top_k: 20
  max_top_k: 200

ui:
  surrounding_radius: 5
  max_surrounding_radius: 10

translate_agent: envit5

translate:
  enabled_default: true
  source: vi
  target: en

  envit5:
    model_name: VietAI/envit5-translation
    device: auto
    max_length: 512
    num_beams: 1
    dtype: auto
    max_new_tokens: 96

  vi2en:
    model_name: vinai/vinai-translate-vi2en-v2
    device: auto
    max_length: 256
    num_beams: 5
    max_new_tokens: 128

  llm:
    api_key: null
    base_url: https://api.xah.io/v1
    model: gpt-5.4
    timeout: 15
    max_workers: 8
    temperature: 0.2
    max_output_tokens: 256
    persona: "Dich ngan gon, kieu keyword."
    cache_size: 2048

# Optional LLM-based query enrichment (paraphrase for semantic search,
# scene/event segmentation for temporal/auto, per-source focused rewrites
# for advanced/fusion search). Disabled by default: when `enabled: false`
# (or this whole key is removed), every search mode behaves EXACTLY as
# before this feature existed (pure regex split_query / split_temporal_events
# / split_semantic_queries) — see `src/retrieval/retriever/common/orchestrator.py`
# and `src/query_enrichment/llm_query_engine.py`.
# OCR/ASR NEVER use this engine (they always search the raw query text).
query_enrichment:
  enabled: true
  # Queries with at most this many words get LLM-paraphrased into
  # complementary sub-queries; longer queries are assumed detailed enough
  # already and are left as-is (regex comma-split fallback still applies).
  min_len_for_paraphrase: 30
  # Max number of paraphrased sub-queries generated per semantic call.
  max_subqueries: 3
  llm:
    api_key: null
    base_url: https://api.xah.io/v1
    model: gpt-5.5
    timeout: 15
    max_retries: 2
    max_workers: 8
    temperature: 0.3
    max_output_tokens: 512

# Fusion weights are independent from query enrichment. They are loaded at
# backend startup and apply whether or not the optional LLM is enabled.
# Semantic model scores are first fused with RRF; the resulting semantic
# score is then combined with OCR/ASR using these weights.
fusion:
  default_weights:
    semantic: 0.8
    ocr: 0.1
    asr: 0.1

speech:
  model_size: base
  device: cpu
  compute_type: int8
  lazy_load: true

debug:
  profile: false
