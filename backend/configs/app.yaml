# Runtime config for the API (`src.api.main` -> `src.retrieval.system.build_system`).
# Keep this file as the single source of truth for online search.

# V3C and LHE each use one isolated Qwen3-VL vLLM embedding index.
datasets:
  default: v3c
  available:
    v3c:
      label: V3C
      root: ../data
      keyframes_root: ../data/keyframes
      videos_root: ../data/videos
      map_keyframes_root: ../data/map_keyframes
      database_root: ../data/database
      color_index_path: ../data/database/color_5x5.npz
      ocr_index: ocr_v3c
      asr_index: asr_v3c
      semantic_models:
        qwen3-vl-embedding-2b:
          index_dir: ../data/database/faiss_qwen3_vl_embedding_2b_vllm/keyframe/V3C
    lhe:
      label: LHE
      root: ../data
      keyframes_root: ../data/keyframes
      videos_root: ../data/videos
      map_keyframes_root: ../data/map_keyframes
      database_root: ../data/database
      color_index_path: ../data/database/color_5x5_lhe.npz
      ocr_index: ocr_lhe
      asr_index: asr_lhe
      semantic_models:
        qwen3-vl-embedding-2b:
          index_dir: ../data/database/faiss_qwen3_vl_embedding_2b_vllm/keyframe/LHE

# Shared model settings and fallback paths for direct tooling. The API replaces
# index paths with each dataset's semantic_models.<model_key>.index_dir.
semantic:
  default_model_key: qwen3-vl-embedding-2b
  models:
    - model_key: qwen3-vl-embedding-2b
      enabled: true
      backend: qwen3_vl_embedding
      model_name: Qwen/Qwen3-VL-Embedding-2B
      model_extra:
        engine: vllm          # embeddings in data/embeddings were produced by vLLM
      index_path: ../data/database/faiss_qwen3_vl_embedding_2b_vllm/keyframe/V3C/keyframe.faiss
      metadata_path: ../data/database/faiss_qwen3_vl_embedding_2b_vllm/keyframe/V3C/metadata.csv
      vector_cache_path: ../data/database/faiss_qwen3_vl_embedding_2b_vllm/keyframe/V3C/vectors_fp32.npy
      device: auto
      precision: fp16
      normalize: false  # The Qwen adapter returns L2-normalized vectors.
      ef_search: 399
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      allow_npy_fallback: false

ocr:
  config_path: configs/ocr_extraction.yaml
asr: null  # Legacy ES scripts remain; online ASR uses embeddings.

segment_data:
  data_root: ../data

color:
  index_path: ../data/database/color_5x5.npz

paths:
  keyframes_root: ../data/keyframes
  videos_root: ../data/videos
  map_keyframe_path: ../data/map_keyframes

search:
  candidate_multiplier: 4
  default_top_k: 20
  max_top_k: 200

ui:
  surrounding_radius: 5
  max_surrounding_radius: 10

translate:
  enabled_default: true
  source: vi
  target: en
  google:
    api_key: null
    timeout: 15

# Optional LLM-based query enrichment (paraphrase for semantic search,
# scene/event segmentation for temporal/auto, per-source focused rewrites
# for advanced/fusion search). Disabled by default: when `enabled: false`
# (or this whole key is removed), every search mode behaves EXACTLY as
# before this feature existed (pure regex split_query / split_temporal_events
# / split_semantic_queries) — see `src/retrieval/retriever/common/orchestrator.py`
# and `src/query_enrichment/llm_query_engine.py`.
# OCR/ASR NEVER use this engine (they always search the raw query text).
query_enrichment:
  # Opt in only after configuring QUERY_ENRICHMENT_API_KEY. Keeping this off
  # makes a fresh clone deterministic and independent of a third-party LLM.
  enabled: false
  # Queries with at most this many words get LLM-paraphrased into
  # complementary sub-queries; longer queries are assumed detailed enough
  # already and are left as-is (regex comma-split fallback still applies).
  min_len_for_paraphrase: 30
  # Max number of paraphrased sub-queries generated per semantic call.
  max_subqueries: 3
  llm:
    api_key: null
    base_url: https://api.xah.io/v1
    model: levuphong2909/gemini-3.5-flash-high
    timeout: 10
    max_retries: 1
    max_workers: 8
    temperature: 0.0
    max_output_tokens: 256

# Fusion weights are independent from query enrichment. They are loaded at
# backend startup and apply whether or not the optional LLM is enabled.
# Semantic models are fused by dense weighted similarity on their candidate
# union; the resulting semantic source is then combined with OCR/ASR.
fusion:
  # These are role assignments, not implementation-specific model names.
  # Any loaded semantic model_key can be used here.
  local_semantic_model: qwen3-vl-embedding-2b
  global_semantic_model: qwen3-vl-embedding-2b
  default_weights:
    semantic: 0.8
    ocr: 0.1
    asr: 0.1

speech:
  model_size: base
  device: cpu
  compute_type: int8
  lazy_load: true

debug:
  profile: false
