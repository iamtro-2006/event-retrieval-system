# Runtime config for the API (`src.api.main` -> `src.retrieval.system.build_system`).
# Keep this file as the single source of truth for online search.

# Milvus connection (shared by every model whose `backend: milvus`).
milvus:
  host: localhost
  port: 19530

semantic:
  default_model_key: siglip2-so400m
  models:
    - model_key: siglip2-so400m
      enabled: true
      backend: milvus
      model_name: ViT-SO400M-16-SigLIP2-384
      pretrained: webli
      collection_name: keyframes_siglip2
      metric_type: IP
      metadata_path: D:/event-retrieval-system/data/database/faiss_hnsw_siglip2_so400m_384/metadata.csv
      device: auto
      precision: amp
      normalize: true
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: D:/event-retrieval-system/data/database/faiss_hnsw_siglip2_so400m_384/vectors_fp32.npy
      allow_npy_fallback: false

    - model_key: vitH-378-quickgelu
      enabled: true
      model_name: vitH-378-quickgelu
      index_path: D:/event-retrieval-system/data/database/faiss_hnsw_dfn_vit_h14_378/keyframes.faiss
      metadata_path: D:/event-retrieval-system/data/database/faiss_hnsw_dfn_vit_h14_378/metadata.csv
      device: auto
      precision: amp
      normalize: true
      ef_search: 399
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: D:/event-retrieval-system/data/database/faiss_hnsw_dfn_vit_h14_378/vectors_fp32.npy
      allow_npy_fallback: false

    - model_key: BLIP2
      enabled: false
      model_name: BLIP2
      index_path: data/database/embedding_blip2_itm_vitg/keyframes.faiss
      metadata_path: data/database/embedding_blip2_itm_vitg/metadata.csv
      device: auto
      precision: fp32
      normalize: true
      ef_search: 399
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: data/database/embedding_blip2_itm_vitg/vectors_fp32.npy
      allow_npy_fallback: false
      model_extra:
        pooling: first

    - model_key: BEiT-3
      enabled: false
      model_name: BEiT-3
      index_path: data/database/embedding_beit3_large_itc/keyframes.faiss
      metadata_path: data/database/embedding_beit3_large_itc/metadata.csv
      device: auto
      precision: fp32
      normalize: true
      ef_search: 399
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: data/database/embedding_beit3_large_itc/vectors_fp32.npy
      allow_npy_fallback: false
      model_extra:
        beit3:
          repo_path: external/unilm/beit3
          model_arch: beit3_large_patch16_384_retrieval
          checkpoint_path: weights/beit3_large_patch16_384_coco_retrieval.pth
          input_size: 384
          spm_path: weights/beit3.spm
          max_text_len: 64

ocr:
  config_path: configs/ocr_extraction.yaml

asr:
  config_path: configs/asr_extraction.yaml

text:
  config_path: configs/text.yaml

fusion: # hybrid search (semantic + text) — score normalization + weighted combination
  weights:
    semantic: 0.6
    text: 0.4
  rrf:
    k: 60          # RRF damping constant
    weight: 0.1    # additive RRF consensus bonus scale
  min_max_epsilon: 1e-6

paths:
  keyframes_root: data/keyframes
  videos_root: data/videos
  map_keyframe_path: data/map_keyframes

search:
  candidate_multiplier: 3
  default_top_k: 20
  max_top_k: 200

ui:
  surrounding_radius: 5
  max_surrounding_radius: 10

translate_agent: envit5

translate:
  enabled_default: true
  source: vi
  target: en

  envit5:
    model_name: VietAI/envit5-translation
    device: auto
    max_length: 512
    num_beams: 1
    dtype: auto
    max_new_tokens: 96

  llm:
    api_key: null
    base_url: https://api.xah.io/v1
    model: deepseek-v4-flash
    timeout: 15
    max_workers: 8
    temperature: 0.2
    max_output_tokens: 256
    persona: "Dich ngan gon, kieu keyword."
    cache_size: 2048

speech:
  model_size: base
  device: cpu
  compute_type: int8
  lazy_load: true

debug:
  profile: false