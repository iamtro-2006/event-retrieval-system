# Runtime config for the API (`src.api.main` -> `src.retrieval.system.build_system`).
# Keep this file as the single source of truth for online search.

semantic:
  default_model_key: pe-core
  models:
    - model_key: siglip2-so400m
      enabled: true
      model_name: ViT-SO400M-16-SigLIP2-384
      index_path: ../data/database/faiss_hnsw_siglip2_so400m_384/keyframes.faiss
      metadata_path: ../data/database/faiss_hnsw_siglip2_so400m_384/metadata.csv
      device: cuda
      precision: amp
      normalize: true
      ef_search: 812
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: ../data/database/faiss_hnsw_siglip2_so400m_384/vectors_fp32.npy
      allow_npy_fallback: false

    # PE-Core is a regular semantic source: once its embeddings/index have
    # been built, enable it here and select/fuse it by model_key="pe-core".
    - model_key: pe-core  
      enabled: true
      backend: perception_encoder
      model_name: PE-Core-L14-336
      pretrained: true
      index_path: ../data/database/faiss_hnsw_pe_core_l14_336/keyframes.faiss
      metadata_path: ../data/database/faiss_hnsw_pe_core_l14_336/metadata.csv
      device: cpu
      precision: amp
      normalize: true
      ef_search: 812
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: ../data/database/faiss_hnsw_pe_core_l14_336/vectors_fp32.npy
      allow_npy_fallback: false
      model_extra:
        perception_encoder:
          center_crop: false



    - model_key: vitH-378-quickgelu
      enabled: false
      model_name: ViT-H-14-378-quickgelu
      index_path: ../data/database/faiss_hnsw_dfn_vit_h14_378/keyframes.faiss
      metadata_path: ../data/database/faiss_hnsw_dfn_vit_h14_378/metadata.csv
      device: auto
      precision: amp
      normalize: true
      ef_search: 512
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: ../data/database/faiss_hnsw_dfn_vit_h14_378/vectors_fp32.npy
      allow_npy_fallback: false

    - model_key: BLIP2
      enabled: false
      model_name: BLIP2
      index_path: data/database/embedding_blip2_itm_vitg/keyframes.faiss
      metadata_path: data/database/embedding_blip2_itm_vitg/metadata.csv
      device: auto
      precision: fp32
      normalize: true
      ef_search: 399
      faiss_threads: 8
      vector_cache_mode: memmap
      vector_cache_dtype: float32
      vector_cache_path: data/database/embedding_blip2_itm_vitg/vectors_fp32.npy
      allow_npy_fallback: false
      model_extra:
        pooling: first

ocr:
  config_path: configs/ocr_extraction.yaml

asr:
  config_path: configs/asr_extraction.yaml

paths:
  keyframes_root: ../data/keyframes
  videos_root: ../data/videos
  map_keyframe_path: ../data/map_keyframes

search:
  candidate_multiplier: 4
  default_top_k: 20
  max_top_k: 200

ui:
  surrounding_radius: 5
  max_surrounding_radius: 10

translate:
  enabled_default: true
  source: vi
  target: en
  google:
    api_key: null
    timeout: 15

# Optional LLM-based query enrichment (paraphrase for semantic search,
# scene/event segmentation for temporal/auto, per-source focused rewrites
# for advanced/fusion search). Disabled by default: when `enabled: false`
# (or this whole key is removed), every search mode behaves EXACTLY as
# before this feature existed (pure regex split_query / split_temporal_events
# / split_semantic_queries) — see `src/retrieval/retriever/common/orchestrator.py`
# and `src/query_enrichment/llm_query_engine.py`.
# OCR/ASR NEVER use this engine (they always search the raw query text).
query_enrichment:
  # Opt in only after configuring QUERY_ENRICHMENT_API_KEY. Keeping this off
  # makes a fresh clone deterministic and independent of a third-party LLM.
  enabled: false
  # Queries with at most this many words get LLM-paraphrased into
  # complementary sub-queries; longer queries are assumed detailed enough
  # already and are left as-is (regex comma-split fallback still applies).
  min_len_for_paraphrase: 30
  # Max number of paraphrased sub-queries generated per semantic call.
  max_subqueries: 3
  llm:
    api_key: null
    base_url: https://api.xah.io/v1
    model: levuphong2909/gemini-3.5-flash-high
    timeout: 10
    max_retries: 1
    max_workers: 8
    temperature: 0.0
    max_output_tokens: 256

# Fusion weights are independent from query enrichment. They are loaded at
# backend startup and apply whether or not the optional LLM is enabled.
# Semantic models are fused by dense weighted similarity on their candidate
# union; the resulting semantic source is then combined with OCR/ASR.
fusion:
  # These are role assignments, not implementation-specific model names.
  # Any loaded semantic model_key can be used here.
  local_semantic_model: pe-core
  global_semantic_model: siglip2-so400m
  default_weights:
    semantic: 0.8
    ocr: 0.1
    asr: 0.1

speech:
  model_size: base
  device: cpu
  compute_type: int8
  lazy_load: true

debug:
  profile: false
