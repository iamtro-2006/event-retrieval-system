# Default target is the local single-node in backend/docker-compose.yaml
# (`docker compose up -d elastic`). Override per machine without editing this
# tracked file: ES_HOST / ES_PORT / ES_SCHEME.
# The index name below is only the fallback for standalone scripts; the API
# always uses datasets.available.<dataset>.asr_index from configs/app.yaml.
elasticsearch:
  host: "localhost"
  port: 9200
  scheme: "http"
  index: "asr_db"


dataset:
  root: "data/processed/asr"

# Offline extraction via scripts.asr.extract.run. Video/output paths come from
# datasets.* in app.yaml, matching scripts.asr.index.run.
extraction:
  model: "Systran/faster-whisper-large-v3"
  device: "cuda"
  compute_type: "int8"
  language: null  # auto-detect the spoken language
  beam_size: 5
  vad_filter: true

mock:
  datasets:
    - L21
    - L22

  videos_per_dataset: 5

  # Mock videos are treated as `video_duration_sec` seconds long, cut into
  # sequential, non-overlapping speech segments of `segment_duration_sec` each.
  video_duration_sec: 600

  min_segment_duration_sec: 3.0
  max_segment_duration_sec: 8.0

  seed: 42
